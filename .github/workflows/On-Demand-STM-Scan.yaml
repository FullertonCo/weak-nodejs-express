name: Prod DigiCert Code On-Demand Scan Action

on:
  workflow_dispatch:

jobs:
  scan:
    name: CodeQL + SBOM (local via act)
    runs-on: ubuntu-latest

    # CodeQL + trivy + upload-artifact need these.
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DigiCert Code Scan composite action (local)
        uses: digicert/digicert-code-monitoring-action@v2-dev
        with:
          host: "https://one.digicert.com"
          api-key: ${{ secrets.DIGICERT_BACKEND_API_KEY }}
          digicert-cdn: "https://pki-downloads.digicert.com/stm/snapshot/stmclients"
